<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">Universal Bridge parameter acknowledgement flow</title>
  <desc id="description">A desired change becomes a qualified write plan, is revision checked and dispatched, then requires a matching target observation before workflow verification and commit. Mismatch, timeout or revision drift creates a conflict or pending state.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/>
    </marker>
    <style>
      .heading { fill: #f8fafc; font: 700 30px 'Segoe UI', sans-serif; }
      .text { fill: #e0f2fe; font: 600 15px 'Segoe UI', sans-serif; }
      .small { fill: #bae6fd; font: 400 13px 'Segoe UI', sans-serif; }
      .flow { stroke: #7dd3fc; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .failure { stroke: #fb7185; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="560" rx="26" fill="url(#background)"/>
  <text x="54" y="62" class="heading">A change is not synchronized until the target is observed</text>

  <g>
    <rect x="54" y="130" width="160" height="100" rx="16" fill="#15365a" stroke="#38bdf8"/>
    <text x="134" y="172" text-anchor="middle" class="text">Desired state</text>
    <text x="134" y="198" text-anchor="middle" class="small">preserve both sides</text>

    <rect x="254" y="130" width="160" height="100" rx="16" fill="#15365a" stroke="#38bdf8"/>
    <text x="334" y="164" text-anchor="middle" class="text">Qualified plan</text>
    <text x="334" y="190" text-anchor="middle" class="small">mapping + timeout</text>
    <text x="334" y="210" text-anchor="middle" class="small">no send yet</text>

    <rect x="454" y="130" width="160" height="100" rx="16" fill="#15365a" stroke="#38bdf8"/>
    <text x="534" y="164" text-anchor="middle" class="text">Revision check</text>
    <text x="534" y="190" text-anchor="middle" class="small">hardware + DAW</text>
    <text x="534" y="210" text-anchor="middle" class="small">must still match</text>

    <rect x="654" y="130" width="160" height="100" rx="16" fill="#15365a" stroke="#38bdf8"/>
    <text x="734" y="172" text-anchor="middle" class="text">Dispatch</text>
    <text x="734" y="198" text-anchor="middle" class="small">bounded adapter write</text>

    <rect x="854" y="130" width="160" height="100" rx="16" fill="#15365a" stroke="#38bdf8"/>
    <text x="934" y="164" text-anchor="middle" class="text">Target observed</text>
    <text x="934" y="190" text-anchor="middle" class="small">value + revision</text>
    <text x="934" y="210" text-anchor="middle" class="small">timestamp + evidence</text>

    <rect x="1018" y="300" width="150" height="100" rx="16" fill="#14532d" stroke="#4ade80"/>
    <text x="1093" y="337" text-anchor="middle" class="text">Acknowledge</text>
    <text x="1093" y="363" text-anchor="middle" class="small">verify, then commit</text>

    <rect x="438" y="365" width="330" height="110" rx="16" fill="#4c1727" stroke="#fb7185"/>
    <text x="603" y="402" text-anchor="middle" class="text">Pending / conflict branch</text>
    <text x="603" y="430" text-anchor="middle" class="small">revision changed • value mismatch • timeout</text>
    <text x="603" y="452" text-anchor="middle" class="small">no blind retry and no silent overwrite</text>
  </g>

  <path d="M214 180 H254" class="flow"/>
  <path d="M414 180 H454" class="flow"/>
  <path d="M614 180 H654" class="flow"/>
  <path d="M814 180 H854" class="flow"/>
  <path d="M1014 180 C1080 180 1093 235 1093 300" class="flow"/>
  <path d="M534 230 V365" class="failure"/>
  <path d="M734 230 C734 300 700 320 680 365" class="failure"/>
  <path d="M934 230 C934 330 800 340 740 365" class="failure"/>
</svg>
