<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Universal Bridge system map</title>
  <desc id="description">Physical music hardware connects to an owning local service. The service coordinates capability evidence, a canonical session, state synchronization and safe transactions. Thin desktop, DAW plug-in and mobile clients connect through authenticated IPC.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#17233d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#65d6ff"/>
    </marker>
    <style>
      .heading { fill: #f8fafc; font: 700 32px 'Segoe UI', sans-serif; }
      .subheading { fill: #b9c7e3; font: 400 16px 'Segoe UI', sans-serif; }
      .box-title { fill: #f8fafc; font: 700 18px 'Segoe UI', sans-serif; }
      .box-text { fill: #dbeafe; font: 400 14px 'Segoe UI', sans-serif; }
      .label { fill: #9ee7ff; font: 600 13px 'Segoe UI', sans-serif; }
      .line { stroke: #65d6ff; stroke-width: 3; fill: none; marker-start: url(#arrow); marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#background)"/>
  <text x="60" y="62" class="heading">Universal Bridge — one session, many adapters</text>
  <text x="60" y="92" class="subheading">Implemented contracts and evidence gates are shown separately from future client integrations.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="150" width="250" height="205" rx="18" fill="#152a46" stroke="#3b82f6"/>
    <text x="84" y="185" class="box-title">Physical and project sources</text>
    <text x="84" y="220" class="box-text">• MPC Sample USB MIDI/audio</text>
    <text x="84" y="248" class="box-text">• Read-only XPJ working copy</text>
    <text x="84" y="276" class="box-text">• Keyboards and controllers</text>
    <text x="84" y="304" class="box-text">• Audio interfaces / optical desks</text>
    <text x="84" y="332" class="box-text">• Future device profiles</text>

    <rect x="390" y="132" width="420" height="240" rx="18" fill="#113c46" stroke="#2dd4bf"/>
    <text x="418" y="170" class="box-title">Per-user local service — sole hardware owner</text>
    <text x="418" y="208" class="box-text">Discovery • endpoint roles • reconnect • diagnostics</text>
    <text x="418" y="238" class="box-text">WinMM/WASAPI today • future qualified backends</text>
    <text x="418" y="268" class="box-text">Authenticated IPC • persistent session association</text>
    <text x="418" y="298" class="box-text">No disk, database or network work on callbacks</text>
    <rect x="418" y="320" width="364" height="32" rx="8" fill="#0f766e"/>
    <text x="600" y="342" text-anchor="middle" class="label">service ownership implemented as diagnostic scaffold</text>

    <rect x="890" y="150" width="250" height="205" rx="18" fill="#2a2147" stroke="#a78bfa"/>
    <text x="914" y="185" class="box-title">Thin clients</text>
    <text x="914" y="220" class="box-text">• Desktop configuration UI</text>
    <text x="914" y="248" class="box-text">• VST3 host client</text>
    <text x="914" y="276" class="box-text">• Future AU / CLAP wrappers</text>
    <text x="914" y="304" class="box-text">• Mobile companion / host</text>
    <text x="914" y="332" class="box-text">• CLI and support diagnostics</text>

    <rect x="190" y="450" width="820" height="190" rx="22" fill="#182335" stroke="#f59e0b"/>
    <text x="220" y="490" class="box-title">Canonical core</text>
    <text x="220" y="526" class="box-text">Versioned session • source assets • pads • slices • sequences • song • mixer • automation</text>
    <text x="220" y="556" class="box-text">Desired + observed state • acknowledgement • branches • merge • conflict • recording plans</text>
    <text x="220" y="586" class="box-text">Independent transport / MIDI / sample / word-clock / timecode / position domains</text>
    <rect x="220" y="606" width="760" height="20" rx="10" fill="#92400e"/>
    <text x="600" y="621" text-anchor="middle" class="label">unavailable → declared → observed → qualified; only exact evidence activates physical routes</text>
  </g>

  <path d="M310 250 H390" class="line"/>
  <path d="M810 250 H890" class="line"/>
  <path d="M600 372 V450" class="line"/>
  <text x="330" y="235" class="label">I/O</text>
  <text x="827" y="235" class="label">IPC</text>
  <text x="615" y="415" class="label">transactions</text>
</svg>
