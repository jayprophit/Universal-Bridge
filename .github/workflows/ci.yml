name: CI
on:
  push:
    branches: [main, develop/v0.5-production-foundation, "feature/**"]
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: cmake --preset dev
      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: cmake --build --preset dev
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = cmake --build --preset dev 2>&1 | Out-String
          $output
          if ($LASTEXITCODE -ne 0) {
            $annotation = $output.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows compiler output::$annotation"
            "## Windows compiler output" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY
            '```text' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            $output | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 1
          }
      - name: Test
        run: ctest --preset dev
      - name: Configure release
        run: cmake --preset release
      - name: Package
        run: cmake --build --preset release --target package
      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: universal-bridge-${{ runner.os }}-${{ runner.arch }}
          path: build/release/Universal-Bridge-*.zip
          if-no-files-found: error
  sanitizers:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure ASan and UBSan
        run: cmake --preset sanitizers
      - name: Build ASan and UBSan
        run: cmake --build --preset sanitizers
      - name: Test ASan and UBSan
        run: ctest --preset sanitizers
  vst3-sdk-validation:
    timeout-minutes: 30
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Obtain pinned Steinberg VST3 SDK
        shell: pwsh
        run: >-
          git clone --branch v3.8.1_build_84 --depth 1 --recurse-submodules
          --shallow-submodules https://github.com/steinbergmedia/vst3sdk.git build/vendor/vst3sdk
      - name: Configure optional VST3 client
        shell: pwsh
        run: >-
          cmake -S . -B build/vst3-ci -G "Visual Studio 17 2022" -A x64
          -DUBRIDGE_BUILD_VST3_CLIENT=ON
          -DUBRIDGE_VST3_SDK_ROOT="$pwd/build/vendor/vst3sdk"
          -DUBRIDGE_WARNINGS_AS_ERRORS=ON
      - name: Build and run Steinberg validator
        run: cmake --build build/vst3-ci --config Release --target UniversalBridgeVST3 --parallel 4
