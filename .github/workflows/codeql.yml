name: CodeQL

on:
  push:
    branches: [main, develop/v0.5-production-foundation]
  pull_request:
    branches: [main, develop/v0.5-production-foundation]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze-cpp:
    name: Analyze C++
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          languages: c-cpp
          build-mode: manual
      - name: Configure analyzed build
        run: cmake --preset dev
      - name: Build analyzed targets
        run: cmake --build --preset dev
      - name: Analyze
        uses: github/codeql-action/analyze@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          category: /language:c-cpp
